    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;

            direction: ltr;

        body {
            background-color: #f9f9ff;
            color: #041b3c;
        }

<body class="font-body-md text-body-md overflow-x-hidden">
    <!-- Header -->
    <header class="w-full sticky top-0 bg-surface dark:bg-surface-dim shadow-sm z-50">
        <nav class="flex justify-between items-center px-margin-mobile md:px-margin-desktop py-base w-full max-w-1440 mx-auto">
            <div class="flex items-center gap-base cursor-pointer" data-nav="home">
                <span class="material-symbols-outlined text-primary">home</span>
                <span class="text-headline-md font-headline-md font-bold text-primary dark:text-primary-fixed-dim">NINJAWO</span>
            </div>
        </nav>
    </header>

    <main class="min-h-screen flex items-center justify-center px-margin-mobile md:px-margin-desktop py-xl">
        <div class="max-w-md w-full">
            <!-- Login Card -->
            <div class="glass-card p-lg rounded-xl shadow-sm">
                <div class="text-center mb-lg">
                    <h1 class="font-headline-md text-headline-md text-on-background mb-sm">Provider Login</h1>
                    <p class="text-on-surface-variant font-body-md">Sign in to your NINJA account</p>
                </div>

                <form id="loginForm" class="space-y-md">
                    <!-- Email -->
                    <div>
                        <label class="block font-label-sm text-label-sm text-on-background mb-sm">Email Address</label>
                        <input type="email" name="email" required placeholder="you@example.com" class="w-full px-md py-sm border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent font-body-md"/>
                    </div>

                    <!-- Password --> <div> <label class="block font-label-sm text-label-sm text-on-background mb-sm"> Password </label> <div class="relative"> <input type="password" name="password" id="password" required placeholder="••••••••" class="w-full px-md py-sm pr-12 border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent font-body-md" /> <!-- Show/Hide Password --> <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors cursor-pointer outline-none" aria-label="Show password" > <span class="material-symbols-outlined" id="passwordEyeIcon"> visibility </span> </button> </div> </div>
                    <!-- Submit Button -->
                    <button type="submit" class="w-full bg-primary text-on-primary px-md py-md rounded-xl font-label-sm text-label-sm hover:brightness-110 active:scale-95 transition-all cursor-pointer">
                        Sign In
                    </button>
                </form>

                <!-- Divider -->
                <div class="flex items-center gap-sm my-lg">
                    <div class="flex-1 h-px bg-outline-variant"></div>
                    <span class="text-caption text-on-surface-variant">or</span>
                    <div class="flex-1 h-px bg-outline-variant"></div>
                </div>

                <!-- Social Login -->
                <button type="button" class="w-full border border-outline-variant text-on-background px-md py-md rounded-xl font-label-sm text-label-sm hover:bg-surface-container transition-all cursor-pointer mb-sm flex items-center justify-center gap-sm">
                    <span class="material-symbols-outlined text-lg">search</span>
                    Continue with Google
                </button>

                <!-- Sign Up Link -->
                <p class="text-center text-on-surface-variant font-body-md mt-lg">
                    Don't have an account? <span class="text-primary font-semibold cursor-pointer hover:underline" data-nav="provider-signup">Sign up</span>
                </p>
            </div>

            <!-- Support Info -->
            <div class="text-center mt-lg">
                <p class="text-on-surface-variant font-caption text-caption mb-sm">Need help?</p>
                <p class="text-on-surface-variant font-caption text-caption">
                    Contact our support team at <span class="text-primary font-semibold">support@NINJAWO.com</span>
                </p>
            </div>
        </div>
    </main>

    <script>
        const navMap = {
            'home': '/',
            'provider-signup': '/provider/signup',
            'forgot-password': '#',
        };

        // Password visibility toggle
        document.addEventListener('DOMContentLoaded', () => {
            const passwordInput = document.getElementById('password');
            const togglePassword = document.getElementById('togglePassword');
            const passwordEyeIcon = document.getElementById('passwordEyeIcon');

            if (!passwordInput || !togglePassword || !passwordEyeIcon) return;

            const syncAria = () => {
                const isHidden = passwordInput.type === 'password';
                togglePassword.setAttribute('aria-label', isHidden ? 'Show password' : 'Hide password');
            };

            togglePassword.addEventListener('click', () => {
                const isHidden = passwordInput.type === 'password';
                passwordInput.type = isHidden ? 'text' : 'password';
                passwordEyeIcon.textContent = isHidden ? 'visibility_off' : 'visibility';
                syncAria();
            });

            syncAria();
        });

        function navigate(route) {
            if (route === '#') return;
            window.parent.postMessage({ type: 'navigate', route }, '*');
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Setup navigation
            document.querySelectorAll('[data-nav]').forEach(element => {
                element.addEventListener('click', (e) => {
                    e.preventDefault();
                    const navKey = element.dataset.nav;
                    const route = navMap[navKey];
                    if (route) {
                        navigate(route);
                    }
                });
            });

            // Form submission
            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
                loginForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const formData = new FormData(loginForm);
                    const data = {
                        email: formData.get('email'),
                        password: formData.get('password'),
                        remember: formData.get('remember') === 'on',
                    };
                    window.parent.postMessage({ type: 'auth:login', payload: data }, '*');
                });
            }
        });
    </script>
</body>
</html>
