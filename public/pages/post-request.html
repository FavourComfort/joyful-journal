<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Post a Request — NINJAWO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
      body{font-family:Inter,system-ui,Arial;margin:24px}
      .card{max-width:720px;margin:0 auto;background:#fff;padding:20px;border-radius:8px;border:1px solid #e6e9ef}
      label{display:block;margin-top:12px;font-weight:600}
      input,textarea{width:100%;padding:8px;margin-top:6px;border-radius:6px;border:1px solid #d7dbe6}
      button{margin-top:14px;padding:10px 14px;background:#003d9b;color:#fff;border-radius:6px;border:none}
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Post a customer request</h1>
      <p>Describe the service you need; providers in your area will be able to see and respond.</p>

      <form id="requestForm">
        <label for="title">State your desired service here</label>
        <input id="title" name="title" required />

        <label for="description">Describe what you need/happened</label>
        <textarea id="description" name="description" rows="6" required></textarea>

        <label for="location">Location (optional)</label>
        <input id="location" name="location" />

        <label for="budget_max">Budget max (optional)</label>
        <input id="budget_max" name="budget_max" type="number" />

        <button type="submit">Post Request</button>
      </form>

      <p id="status" aria-live="polite" style="margin-top:12px;color:#334"> </p>
    </div>

    <script type="module">
      // Replace these with your Supabase project values (safe to use anon key here)
      const SUPABASE_URL = 'https://jtgazphazibkbtfmkzpt.supabase.co';
      const SUPABASE_ANON_KEY = 'sb_publishable_qaKfqyoeES7sTJQK54rIbw_DEHPWu3t';

      import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const form = document.getElementById('requestForm');
      const status = document.getElementById('status');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        status.textContent = 'Posting...';

        const user = (await supabase.auth.getUser()).data?.user;
        if (!user) {
          status.textContent = 'You must be signed in to post a request.';
          return;
        }

        const payload = {
          customer_id: user.id,
          title: document.getElementById('title').value.trim(),
          description: document.getElementById('description').value.trim(),
          location: document.getElementById('location').value.trim() || null,
          budget_max: document.getElementById('budget_max').value ? Number(document.getElementById('budget_max').value) : null,
        };

        const { data: createdRequest, error } = await supabase
          .from('requests')
          .insert([payload])
          .select()
          .single();

        if (error) {
          console.error(error);
          status.textContent = 'Failed to post request: ' + (error.message || String(error));
          return;
        }

        try {
          // Keep the data flow working without a live email domain configured yet.
          // When you are ready, replace this placeholder block with a Resend call.
          const REQUEST_EMAILS_ENABLED = false;

          const requestLocation = (createdRequest?.location || '').trim();
          const { data: providers, error: providerLookupError } = await supabase
            .from('providers')
            .select('id, business_name, location')
            .eq('verified', true);

          if (providerLookupError) {
            console.warn('Provider lookup failed:', providerLookupError);
          }

          const matchingProviders = (providers || []).filter((provider) => {
            if (!requestLocation) return true;
            const providerLocation = (provider.location || '').toLowerCase();
            return providerLocation.includes(requestLocation.toLowerCase());
          });

          if (matchingProviders.length > 0 && REQUEST_EMAILS_ENABLED) {
            const requestLink = `${window.location.origin}/provider/requests?requestId=${createdRequest.id}`;
            const notificationRows = matchingProviders.map((provider) => ({
              request_id: createdRequest.id,
              provider_id: provider.id,
              subject: 'You have a new service request from NINJAWO',
              message: `A new request, "${createdRequest.title}", is waiting for you. View it here: ${requestLink}`,
              link: requestLink,
              status: 'new',
            }));

            const { error: notifyError } = await supabase
              .from('request_notifications')
              .insert(notificationRows);

            if (notifyError) {
              console.warn('Notification insert failed:', notifyError);
            }
          }

          if (!REQUEST_EMAILS_ENABLED) {
            console.info('Provider email delivery is disabled until your domain is added for Resend. Request data and matching still work.');
          }
        } catch (notificationError) {
          console.warn('Notification flow failed:', notificationError);
        }

        status.textContent = 'Request posted — matching providers are queued for notification when your email domain is ready.';
        form.reset();
      });
    </script>
      <script src="/pages/shared-drawer.js" defer></script>
  </body>
</html>
